<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#000000" />
    <script>
      ;(() => {
        const storageKey = "theme"
        const root = document.documentElement
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)")

        const resolveTheme = (theme) =>
          theme === "system" ? (mediaQuery.matches ? "dark" : "light") : theme

        function updateThemeColor(nextTheme) {
          const themeColor = nextTheme === "dark" ? "#000000" : "#ffffff"
          let meta = document.querySelector('meta[name="theme-color"]')

          if (!meta) {
            meta = document.createElement("meta")
            meta.setAttribute("name", "theme-color")
            document.head.appendChild(meta)
          }

          meta.setAttribute("content", themeColor)
        }

        function applyResolvedTheme(resolvedTheme) {
          root.classList.remove("light", "dark")
          root.classList.add(resolvedTheme)
          root.style.colorScheme = resolvedTheme
          root.style.backgroundColor =
            resolvedTheme === "dark" ? "#000000" : "#ffffff"
          updateThemeColor(resolvedTheme)
        }

        // Keep in sync with src/lib/theme-colors.ts (DEFAULT_THEME).
        let theme = "dark"

        try {
          const storedTheme = localStorage.getItem(storageKey)
          if (storedTheme === "light" || storedTheme === "dark" || storedTheme === "system") {
            theme = storedTheme
          }
        } catch (_e) {
          theme = "dark"
        }

        applyResolvedTheme(resolveTheme(theme))

        // 涨跌颜色: keep in sync with src/lib/price-color.ts.
        let priceColor = "red-up"
        try {
          const storedPriceColor = localStorage.getItem("priceColor")
          if (storedPriceColor === "red-up" || storedPriceColor === "green-up") {
            priceColor = storedPriceColor
          }
        } catch (_e) {}
        root.setAttribute("data-price-color", priceColor)

        root.toggleAttribute("data-initial-home", location.pathname === "/")
        root.toggleAttribute("data-initial-detail", /^\/server\/[^/]+\/?$/.test(location.pathname))

      })()
    </script>

      .boot-shell { box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column; padding: 12px; font: 14px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

      .boot-desc, .boot-link { display: none; width: 96px; height: 14px; }
      .boot-square { width: 32px; height: 32px; border-radius: 4px; }
      .boot-pill { width: 72px; height: 32px; border-radius: 4px; }
      .boot-mobile { height: 20px; margin-top: 4px; }
      .boot-status { height: 24px; margin-top: 12px; }
      .boot-status .boot-bar:first-child { width: 160px; height: 12px; }
      .boot-status .boot-bar:last-child { width: 64px; height: 14px; }
      .boot-card { border: 1px solid var(--sk-border); border-radius: 6px; background: var(--sk-card); }

      .boot-panel { grid-column: span 2; display: flex; flex-direction: column; gap: 10px; padding: 12px; height: 100px; }

      .boot-panel:last-child { height: 87px; }

      .boot-panel .boot-bar:nth-child(2) { width: 128px; height: 28px; }
      .boot-panel .boot-bar:nth-child(3) { width: 160px; height: 12px; }
      .boot-controls { height: 32px; margin-top: 12px; }
      .boot-controls .boot-bar { height: 32px; border-radius: 4px; }
      .boot-controls .boot-group .boot-bar:nth-child(1) { width: 112px; }
      .boot-controls .boot-group .boot-bar:nth-child(2) { width: 64px; }
      .boot-controls .boot-group .boot-bar:nth-child(3) { width: 48px; height: 24px; }
      .boot-controls .boot-group .boot-bar:nth-child(4) { display: none; width: 80px; height: 24px; }

      @media (min-width: 640px) { .boot-mobile { display: none; } .boot-controls .boot-group .boot-bar:nth-child(4) { display: block; } }
      @media (min-width: 768px) {
        .boot-shell { padding: 24px; }
        .boot-desc, .boot-link { display: block; }
        .boot-ticker { margin: 16px 0 0; padding: 0; }
        .boot-overview { gap: 12px; }

      .boot-spinner { --size: 12px; width: var(--size); height: var(--size); flex-shrink: 0; }
      .boot-spinner-inner { position: relative; top: 50%; left: 50%; width: var(--size); height: var(--size); }
      .boot-spinner-bar { position: absolute; background: currentColor; border-radius: 6px; height: 13%; width: 30%; left: -10%; top: -3.9%; animation: boot-spin .8s linear infinite; }
      .boot-spinner-bar:nth-child(1) { transform: rotate(0deg) translate(120%); animation-delay: -0.8s; }
      .boot-spinner-bar:nth-child(2) { transform: rotate(45deg) translate(120%); animation-delay: -0.7s; }
      .boot-spinner-bar:nth-child(3) { transform: rotate(90deg) translate(120%); animation-delay: -0.6s; }
      .boot-spinner-bar:nth-child(4) { transform: rotate(135deg) translate(120%); animation-delay: -0.5s; }

      .boot-spinner-bar:nth-child(7) { transform: rotate(270deg) translate(120%); animation-delay: -0.2s; }
      .boot-spinner-bar:nth-child(8) { transform: rotate(315deg) translate(120%); animation-delay: -0.1s; }
      @keyframes boot-spin { from { opacity: 1; } to { opacity: .15; } }
